name: simdiff

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simdiff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
        mujoco: ['3.9.0', '3.14.0']
    runs-on: ${{ matrix.os }}
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest "mujoco==${{ matrix.mujoco }}"
      - name: Selected checks, precision regression and CLI contracts
        run: python -m pytest -q

  dependency-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest 'mujoco==3.9.0' 'numpy==1.26.0' 'pydantic==2.6.0'
      - run: python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv build
      - name: Install the built wheel instead of the editable source
        run: uv pip install --python .venv/bin/python --reinstall dist/*.whl
      - name: Exercise wheel from outside the checkout
        run: .venv/bin/python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: simdiff-distributions
          path: dist/*
          if-no-files-found: error
