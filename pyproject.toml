[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simdiff"
version = "0.1.0b1"
description = "Compare selected robot-model semantics before and after conversion."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mujoco>=3.9,<3.15", "numpy>=1.26", "pydantic>=2.6,<3"]

[project.scripts]
simdiff = "simdiff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "BLE"]
